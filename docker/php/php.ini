; =============================================================================
; CREA Pro-Link | Ajustes de PHP
; =============================================================================

; --- Localização (itens 8.3.1.g e 8.3.1.h do Termo de Referência) -----------
date.timezone = America/Manaus
default_charset = "UTF-8"
mbstring.internal_encoding = UTF-8

; --- Erros: nunca exibidos ao usuário; sempre registrados -------------------
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
error_log = /var/www/html/storage/logs/php-erros.log

; --- Limites ----------------------------------------------------------------
memory_limit = 256M
max_execution_time = 60
post_max_size = 12M
upload_max_filesize = 8M
max_file_uploads = 10

; --- Sessão: cookie endurecido ----------------------------------------------
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 7200
session.sid_length = 48
session.sid_bits_per_character = 6

; --- Não anunciar a versão do PHP -------------------------------------------
expose_php = Off

; --- Desempenho -------------------------------------------------------------
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
realpath_cache_size = 4096K
