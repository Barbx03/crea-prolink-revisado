# =============================================================================
# CREA Pro-Link | Virtual host
#
# A raiz de documentos é public/. Nenhum arquivo de app/, views/, _arq/,
# vendor/ ou storage/ é alcançável pelo navegador.
# =============================================================================

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    # Diretório de imagens enviadas: conteúdo estático, nunca executável
    <Directory /var/www/html/public/uploads>
        Options -Indexes -ExecCGI
        php_admin_flag engine off
        RemoveHandler .php .phtml .phar
        AddType text/plain .php .phtml .phar
    </Directory>

    # Bloqueia o acesso direto a qualquer diretório fora de public/
    <DirectoryMatch "^/var/www/html/(app|views|_arq|vendor|storage|docker|tests)">
        Require all denied
    </DirectoryMatch>

    # Bloqueia arquivos de configuração e controle de versão
    <FilesMatch "^(\.env.*|_config\.php|composer\.(json|lock)|\.git.*|Dockerfile|docker-compose\.yml)$">
        Require all denied
    </FilesMatch>

    ServerSignature Off
    Header always unset X-Powered-By

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
